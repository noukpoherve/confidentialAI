# ══════════════════════════════════════════════════════════════════════════════
# CI — Build, Release & Gate
#
# Consolidates: build artifacts, GitHub releases, and CI gate.
#
# Triggers:
#   push to any branch       → CI gate (only when this file changes)
#   push of v*.*.* tag       → full release: build all extension zips + GitHub Release
#   pull_request to main     → CI gate (only when this file changes)
#   workflow_dispatch        → manual release build
#
# Note: path filters apply to branch pushes only — tag pushes always trigger.
#
# HOW TO TRIGGER A RELEASE:
#   git tag v1.2.3 -m "Release v1.2.3"
#   git push origin v1.2.3
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/ci.yml"
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with extension artifacts?"
        type: boolean
        default: false

# Cancel previous runs on the same branch/PR; releases on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  packages: write

jobs:
  ci:
    name: "CI / Build / Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── CI gate ───────────────────────────────────────────────────────────────
      # Visible checkpoint for branch protection rules.
      # Real quality gates are frontend.yml and backend.yml.

      - name: CI gate
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "CI gate passed — see frontend and backend workflow results."

      # ── Extension build for all browsers ─────────────────────────────────────
      # Runs on tags (release) or manual dispatch with create_release=true.

      - name: Install extension dependencies
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        working-directory: apps/browser-extension
        run: npm ci

      - name: Run extension tests
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        working-directory: apps/browser-extension
        run: npm test -- --run

      - name: Build extension — Chrome
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        working-directory: apps/browser-extension
        run: npm run build:extensions:chrome

      - name: Build extension — Firefox
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        working-directory: apps/browser-extension
        run: npm run build:extensions:firefox

      - name: Build extension — Edge
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        working-directory: apps/browser-extension
        run: npm run build:extensions:edge

      - name: Package extensions as zips
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        working-directory: apps/browser-extension
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          for BROWSER in chrome firefox edge; do
            ZIP="confidential-agent-extension-${BROWSER}-${VERSION}.zip"
            cd dist/${BROWSER} && zip -r "../../${ZIP}" . && cd ../..
            echo "Packaged: ${ZIP}"
          done

      - name: Upload extension artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-builds
          path: apps/browser-extension/confidential-agent-extension-*.zip
          retention-days: 90

      # ── GitHub Release (tags only) ────────────────────────────────────────────

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: apps/browser-extension/confidential-agent-extension-*.zip
          body: |
            ## Browser Extension ${{ github.ref_name }}

            ### Installation
            - **Chrome / Edge**: `chrome://extensions` → Developer mode → Load unpacked
            - **Firefox**: `about:debugging` → This Firefox → Load Temporary Add-on
