[project]
name = "confidential-agent-security-api"
version = "0.2.0"
description = "FastAPI security decision engine for confidential-agent."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "qdrant-client>=1.12.0,<2",
    "langgraph>=1.1.3",
    "PyJWT>=2.10.1",
    "pydantic==2.11.7",
    "email-validator>=2.2.0",
    "pymongo==4.11.3",
    "python-dotenv>=1.0.1",
    "spacy>=3.7.0,<4",
    "uvicorn==0.35.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
    # GLiNER: optional local transformer NER (install separately — see docs/ARCHITECTURE.md)
    # "gliner>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.0",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line too long — handled by black, not ruff
    "B008",   # Depends() in defaults — FastAPI pattern, intentional
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
